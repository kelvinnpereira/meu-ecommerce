services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/ecommerce.db
      - E2E_DATABASE_PATH=/data/ecommerce.db
      - PYTHONPATH=/home/appuser/app
    volumes:
      - ./backend:/home/appuser/app
      - backend_data:/data
    command: sh -c "python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  backend_data:
